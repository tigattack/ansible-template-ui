name: CI

on:
  push:
    branches: ['main']
  workflow_call:
  workflow_dispatch:

# NOTE: The 'test', 'lint', and 'frontend-build' jobs are intended to be
# required status checks. Configure them in: Settings -> Branches -> Branch
# protection rules -> Require status checks to pass before merging.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -v -m "not integration"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run ruff
        run: uv run ruff check .

      - name: Run pyright
        run: uv run pyright

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Lint frontend
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-assets
          path: ansible_template_ui/client/

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Run E2E tests
        run: bunx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    env:
      INTEGRATION_RENDERER_IMAGE: ansible-template-renderer:integration
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - uses: docker/setup-buildx-action@v4

      - name: Build renderer image
        uses: docker/build-push-action@v7
        with:
          context: docker/renderer/
          load: true
          tags: ${{ env.INTEGRATION_RENDERER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run integration tests
        run: uv run pytest tests/ -v -m integration
