services:
  app:
    image: ghcr.io/tigattack/ansible-template-ui:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - /path/to/my/filter_plugins:/plugins/filter:ro # Optionally mount filter plugins
      # - /path/to/my/lookup_plugins:/plugins/lookup:ro # Optionally mount lookup plugins
      # - /path/to/my/test_plugins:/plugins/test:ro     # Optionally mount test plugins
    ports:
      - "8080:8080"
    environment:
      # Optional: override plugin paths if mounting to a non-default location
      # FILTER_PLUGIN_PATH: /custom/filter/path
      # LOOKUP_PLUGIN_PATH: /custom/lookup/path
      # TEST_PLUGIN_PATH: /custom/test/path
      # Optional: space-separated ansible-galaxy collection names (cached in Docker volume at startup, not installed per-render)
      # Example: "community.general community.crypto"
      # Leave empty to skip galaxy installs (faster renders)
      ANSIBLE_GALAXY_COLLECTIONS: ""
